<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 308 130" width="308" height="130">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;display=swap');</style>
    <linearGradient id="grad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="muted" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#7a5a9e"/>
      <stop offset="50%" stop-color="#6668a8"/>
      <stop offset="100%" stop-color="#5472a8"/>
    </linearGradient>
  </defs>
  <!-- Outer decorative rings -->
  <circle cx="62" cy="90" r="62" fill="none" stroke="url(#grad)" stroke-width="0.5" stroke-opacity="0.12"/>
  <circle cx="62" cy="90" r="50" fill="none" stroke="url(#grad)" stroke-width="0.7" stroke-opacity="0.22"/>
  <!-- O letterform -->
  <circle cx="62" cy="90" r="37" fill="none" stroke="url(#grad)" stroke-width="10"/>
  <!-- Inner rings -->
  <circle cx="62" cy="90" r="23" fill="none" stroke="url(#grad)" stroke-width="1.1" stroke-opacity="0.55"/>
  <circle cx="62" cy="90" r="15" fill="none" stroke="url(#grad)" stroke-width="0.9" stroke-opacity="0.35"/>
  <circle cx="62" cy="90" r="8"  fill="none" stroke="url(#grad)" stroke-width="0.7" stroke-opacity="0.2"/>
  <!-- rigo -->
  <text x="109" y="122" font-family="'Outfit', sans-serif" font-size="74" font-weight="600" fill="url(#muted)" letter-spacing="-1">rigo</text>
</svg>
