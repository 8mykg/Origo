<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="512" height="512">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;display=swap');</style>
    <linearGradient id="grad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Outer decorative rings -->
  <circle cx="90" cy="90" r="78" fill="none" stroke="url(#grad)" stroke-width="0.6" stroke-opacity="0.12"/>
  <circle cx="90" cy="90" r="65" fill="none" stroke="url(#grad)" stroke-width="0.8" stroke-opacity="0.22"/>
  <!-- O letterform -->
  <circle cx="90" cy="90" r="50" fill="none" stroke="url(#grad)" stroke-width="13"/>
  <!-- Inner rings -->
  <circle cx="90" cy="90" r="31" fill="none" stroke="url(#grad)" stroke-width="1.1" stroke-opacity="0.55"/>
  <circle cx="90" cy="90" r="20" fill="none" stroke="url(#grad)" stroke-width="0.9" stroke-opacity="0.35"/>
  <circle cx="90" cy="90" r="11" fill="none" stroke="url(#grad)" stroke-width="0.7" stroke-opacity="0.2"/>
</svg>
